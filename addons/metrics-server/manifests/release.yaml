apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 10m
  targetNamespace: ${addon_namespace}
  releaseName: metrics-server
  install:
    createNamespace: true
  chart:
    spec:
      chart: metrics-server
      version: 3.13.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  valuesFrom:
    - kind: ConfigMap
      name: addon-metrics-server-params
      optional: true
  values:
