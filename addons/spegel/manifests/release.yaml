apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 10m
  targetNamespace: ${addon_namespace}
  releaseName: spegel
  install:
    createNamespace: true
  chart:
    spec:
      chart: spegel
      version: 0.7.0
      sourceRef:
        kind: HelmRepository
        name: spegel
  valuesFrom:
    - kind: ConfigMap
      name: addon-spegel-params
      optional: true
  values:
    spegel:
      prependExisting: true
