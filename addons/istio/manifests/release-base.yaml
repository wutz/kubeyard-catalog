apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
spec:
  interval: 10m
  targetNamespace: ${addon_namespace}
  releaseName: istio-base
  install:
    createNamespace: true
  chart:
    spec:
      chart: base
      version: 1.29.1
      sourceRef:
        kind: HelmRepository
        name: istio
