apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  interval: 10m
  targetNamespace: ${addon_namespace}
  releaseName: istiod
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: 1.29.1
      sourceRef:
        kind: HelmRepository
        name: istio
  valuesFrom:
    - kind: ConfigMap
      name: addon-istio-params
      optional: true
  values:
    pilot:
      env:
        PILOT_ENABLE_MULTI_CLUSTER: false
        PILOT_KUBERNETES_API_QPS: "100"
        PILOT_KUBERNETES_API_BURST: "200"
        PILOT_SYNC_INTERVAL: "1s"
    global:
      multiCluster:
        clusterName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
        ephemeral-storage: 512Mi
    autoscaleMin: 1
