apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 10m
  targetNamespace: ${addon_namespace}
  releaseName: cert-manager
  install:
    createNamespace: true
  chart:
    spec:
      chart: cert-manager
      version: v1.19.1
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  valuesFrom:
    - kind: ConfigMap
      name: addon-cert-manager-params
      optional: true
  values:
    crds:
      enabled: true
      keep: true
    podDisruptionBudget:
      enabled: true
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
    cainjector:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
