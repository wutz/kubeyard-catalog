apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: kubeyard-system
spec:
  interval: 10m
  targetNamespace: ${addon_namespace}
  releaseName: metallb
  install:
    createNamespace: true
  chart:
    spec:
      chart: metallb
      version: 0.15.3
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    controller:
      tolerations:
        - operator: Exists
          effect: NoSchedule
    speaker:
      ignoreExcludeLB: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
